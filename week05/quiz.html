<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Basic HTML and CSS Quiz">
    <meta name="author" content="Fidelis Gabriel">

    <title>Quiz</title>

    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>

    <main class="quiz-container">

        <h1>
            <span class="check-icon">✔</span>
            Basic HTML and CSS Quiz
        </h1>

        <form action="#" method="get">

            <!-- Question 1 -->
            <div class="question">
                <label for="q1">
                    <span>1.</span> What does the acronym CSS stand for?
                </label>

                <input type="text" id="q1" name="q1" required>
            </div>

            <!-- Question 2 -->
            <div class="question">
                <label for="q2">
                    <span>2.</span> How are id and class attributes selected in CSS?
                </label>

                <textarea id="q2" name="q2" rows="3" required></textarea>
            </div>

            <!-- Question 3 -->
            <div class="question">
                <label for="q3">
                    <span>3.</span> Which of the following is a valid CSS comment?
                </label>

                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="option1">// This is a comment</option>
                    <option value="option2">/* This is a comment */</option>
                    <option value="option3"># This is a comment</option>
                </select>
            </div>

            <!-- Question 4 -->
            <div class="question">
                <label for="q4">
                    <span>4.</span> What is the bottom margin given this declaration?
                </label>

                <div class="code-example">
                    <code>margin: 10px 5px 15px;</code>
                </div>

                <input type="number" id="q4" name="q4" required>
            </div>

            <!-- Submit Button -->
            <button type="submit">Submit Quiz for Grading</button>

        </form>

    </main>

</body>

</html>
