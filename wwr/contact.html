<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact White Water Rafting Company for reservations, rafting adventures, questions, and customer support.">

    <meta name="author" content="Fidelis Gabriel Aiyejina">

    <title>Contact Us | White Water Rafting Company</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body class="contact-page">

    <!-- HEADER -->
    <header>

        <img src="images/rafting-logo.png" alt="White Water Rafting Company Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>

    <main>

        <!-- COMPANY INFORMATION -->
        <section class="contact-company">

            <h1>White Water Rafting Company</h1>

            <p>
                <strong>
                    123 Main River Street<br>
                    Kolob, California<br>
                    +1 999 999 9999<br>
                    info@whitewater.com
                </strong>
            </p>

        </section>

        <!-- MAP AND CONTACT FORM -->
        <section class="contact-main">

            <h2>Get in Touch With Us</h2>

            <!-- GOOGLE MAP -->
            <div class="contact-map">

                <iframe src="https://www.google.com/maps?q=Kolob%2C%20California&output=embed" title="Map showing White Water Rafting Company location" width="600" height="250" loading="lazy">
                </iframe>

            </div>

            <!-- CONTACT FORM -->
            <div class="contact-form-container">

                <form class="contact-form" action="#" method="get">

                    <!-- NAME -->
                    <div class="form-row">

                        <label for="fullname">Name</label>

                        <input type="text" id="fullname" name="fullname" placeholder="Placeholder" required>

                    </div>

                    <!-- EMAIL -->
                    <div class="form-row">

                        <label for="email">Email</label>

                        <input type="email" id="email" name="email" placeholder="Placeholder" required>

                    </div>

                    <!-- MESSAGE PURPOSE -->
                    <div class="form-row purpose-row">

                        <fieldset>

                            <legend>Message Purpose</legend>

                            <label for="general">
                                <input type="radio" id="general" name="purpose" value="General Inquiry" required>
                                General Inquiry
                            </label>

                            <label for="reservation">
                                <input type="radio" id="reservation" name="purpose" value="Reservation Question">
                                Reservation Question
                            </label>

                            <label for="suggestion">
                                <input type="radio" id="suggestion" name="purpose" value="Website Suggestion">
                                Website Suggestion
                            </label>

                        </fieldset>

                    </div>

                    <!-- MESSAGE -->
                    <div class="form-row message-row">

                        <label for="message">Message</label>

                        <textarea id="message" name="message" rows="4" placeholder="Type here..." required></textarea>

                    </div>

                    <!-- NEWSLETTER -->
                    <div class="newsletter-option">

                        <label for="subscribe">

                            <input type="checkbox" id="subscribe" name="subscribe" value="yes">

                            Please subscribe me to the monthly newsletter

                        </label>

                    </div>

                    <!-- SUBMIT BUTTON -->
                    <button type="submit">Get in Touch!</button>

                </form>

            </div>

        </section>

        <!-- EMPLOYEE SECTION -->
        <section class="employee-section">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-gallery">

                <figure>

                    <img src="images/john-smith.jpg" alt="Portrait of John Smith">

                    <figcaption>
                        <strong>John Smith</strong><br>
                        Company Manager
                    </figcaption>

                </figure>

                <figure>

                    <img src="images/sarah-johnson.jpg" alt="Portrait of Sarah Johnson">

                    <figcaption>
                        <strong>Sarah Johnson</strong><br>
                        Head Rafting Guide
                    </figcaption>

                </figure>

                <figure>

                    <img src="images/michael-brown.jpg" alt="Portrait of Michael Brown">

                    <figcaption>
                        <strong>Michael Brown</strong><br>
                        Customer Service Officer
                    </figcaption>

                </figure>

            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer>

        <p>
            &copy; 2026 | White Water Rafting Company |
            Fidelis Gabriel Aiyejina
        </p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn">
            </a>

        </nav>

    </footer>

</body>

</html>
